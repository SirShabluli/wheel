services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: luckywheel

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3001
      MONGODB_URI: mongodb+srv://eranhaim321_db_user:56bLnZ8kf9iqXNkU@cluster0.pncliin.mongodb.net/test
      CORS_ORIGIN: http://localhost
      # Add your other env vars here (JWT_SECRET, SMTP, etc.)
    env_file:
      - ./server/.env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: http://54.173.144.0:3001
        VITE_IMAGES_BASE: https://telescope-media-us.s3.us-east-1.amazonaws.com
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8081:80"

volumes:
  mongo_data:
