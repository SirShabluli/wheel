services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: luckywheel

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: http://54.173.144.0:3001
        VITE_IMAGES_BASE: https://telescope-media-us.s3.us-east-1.amazonaws.com
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8081:80"

volumes:
  mongo_data:
